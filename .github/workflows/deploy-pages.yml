name: Publicar CUIÚDO no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar o repositório
        uses: actions/checkout@v4
      - name: Validar site e as 14 imagens locais
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          code=(root/'feed-data.js').read_text(encoding='utf-8')
          paths=re.findall(r'"url": "(\./assets/feed/[^"]+\.webp)"',code)
          assert len(paths)==17, f'Esperadas 17 imagens, existem {len(paths)}'
          for p in paths:
              data=Path(p).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'{p} inválido'
          assert (root/'apple.css').is_file(), 'Tema Apple ausente'
          print('17/17 imagens WEBP OK; index, CSS e JS prontos')
          PY
      - name: Preparar pacote do site
        run: |
          node scripts/build-cloudflare.mjs
          mkdir -p _site
          cp -R dist/. _site/
          test -f _site/gratidao-catolica.js
          test -f _site/gratidao-catolica.css
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
