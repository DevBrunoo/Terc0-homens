name: Melhorar resolução de imagens São Bento
on:
  push:
    branches: [main]
    paths:
      - 'scripts/try-benedict-hd.py'
      - '.github/workflows/try-benedict-hd.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q Pillow requests
      - run: python scripts/try-benedict-hd.py
      - name: Guardar imagem se recuperada em alta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/medalha-sao-bento-colorida.webp assets/sao-bento-arte-enviada.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: imagens enviadas de São Bento em melhor resolução"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
