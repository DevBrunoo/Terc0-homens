name: Importar duas imagens enviadas de São Bento
on:
  push:
    branches: [main]
    paths: ['scripts/import-benedict-uploads.py','.github/workflows/import-benedict-uploads.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-user-art:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q Pillow requests
      - name: Incorporar as duas imagens ao repositório
        run: python scripts/import-benedict-uploads.py
      - name: Gravar arquivos de imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/medalha-sao-bento-colorida.webp assets/sao-bento-arte-enviada.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: incluir medalha colorida e arte de São Bento enviadas pelo usuário"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
