name: Incorporar imagens locais ao CUIÚDO
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cache_feed_art.py'
      - '.github/workflows/cache-feed-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar utilitários de imagem
        run: python -m pip install --quiet Pillow requests
      - name: Incorporar pinturas e fotos como WebP
        run: python scripts/cache_feed_art.py
      - name: Confirmar arquivos e enviar ao repositório
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import Counter
          files=list(Path('assets/feed').glob('*.webp'))
          assert len(files)>=4, f'Somente {len(files)} imagens reais'
          for image in files:
              with Image.open(image) as img:
                  img.verify()
          print(f'{len(files)} imagens locais verificadas')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/feed feed-data.js
          if ! git diff --cached --quiet; then
            git commit -m "assets: hospedar fotos e pinturas do feed dentro do GitHub Pages"
            git push origin HEAD:main
          fi
