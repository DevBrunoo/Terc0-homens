name: Incorporar 20 pinturas sacras locais
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cache_rosary_art.py'
      - '.github/workflows/cache-rosary-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de imagem
        run: python -m pip install --quiet Pillow requests
      - name: Baixar 20 obras e salvar com créditos
        run: python scripts/cache_rosary_art.py
      - name: Verificar e atualizar repositório
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          photos=list(Path('assets/misterios/fotos').glob('*.webp'))
          assert len(photos)>=12, f'Somente {len(photos)} fotos foram baixadas'
          for path in photos:
              with Image.open(path) as image:image.verify()
          print(f'{len(photos)} fotografias de pinturas, verificadas.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/misterios/fotos rosary-artwork.js
          if ! git diff --cached --quiet; then
            git commit -m "assets: adicionar pinturas licenciadas aos vinte mistérios"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
