name: Verificar imagens do site publicado
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirmar página publicada e imagens
        run: |
          python - <<'PY'
          import time
          import urllib.request
          base='https://devbrunoo.github.io/Terc0-homens/'
          paths=['','index.html','feed-data.js','feed-ui.js','feed.css',
            'assets/feed/miguel-reni.webp','assets/feed/cristo-deserto.webp',
            'assets/feed/cowboy-remington.webp']
          for path in paths:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Cuiudo-Pages-Health/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=17) as response:
                      body=response.read()
                      print(f'{response.status} {len(body):7} {response.headers.get("content-type")} {url}',flush=True)
                      if path.endswith('.webp'):
                          assert body[:4]==b'RIFF' and body[8:12]==b'WEBP', 'Asset não é WebP'
                      if path=='index.html' or path=='':
                          assert b'feed-data.js' in body, 'O HTML publicado não é a versão nova'
              except Exception as exc:
                  print(f'ERRO {url} {type(exc).__name__} {exc}',flush=True)
                  raise
          PY
