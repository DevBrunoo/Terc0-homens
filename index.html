  <script>
  try {
    const saved=JSON.parse(localStorage.getItem('cuiudo-v1')||'{}');
    const preference=saved.designVersion==='apple-v11'&&['light','dark','system'].includes(saved.theme)?saved.theme:'light';
    const active=preference==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;
    document.documentElement.dataset.theme=active;
    document.querySelector('meta[name="theme-color"]').content=active==='light'?'#f5f5f7':'#0f1012';
  } catch { document.documentElement.dataset.theme='light'; }
  </script>
