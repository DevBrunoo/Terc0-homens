<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="CUIÚDO: fé que se vive. Terço diário, Escritura em português e inglês, santos e anjos, temas claro e escuro." />
  <meta property="og:title" content="CUIÚDO — Fé, Coragem e Ação" />
  <meta property="og:description" content="Reza. Levanta. Faz acontecer." />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
  try {
    const saved=JSON.parse(localStorage.getItem('cuiudo-v1')||'{}');
    const preference=saved.designVersion==='white-arial-v1'&&['light','dark','system'].includes(saved.theme)?saved.theme:'light';
    const active=preference==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;
    document.documentElement.dataset.theme=active;
    document.querySelector('meta[name="theme-color"]').content=active==='light'?'#ffffff':'#111111';
  } catch { document.documentElement.dataset.theme='light'; }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <title>CUIÚDO — Fé, Coragem e Ação</title>
</head>
<body>
  <div id="app"><div class="boot"><div class="boot-cross">✝</div><span>FÉ. CORAGEM. AÇÃO.</span></div></div>
  <noscript>Este aplicativo precisa de JavaScript habilitado.</noscript>
  <script defer src="./data.js"></script>
  <script defer src="./brutal.js"></script>
  <script defer src="./devocionario.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
