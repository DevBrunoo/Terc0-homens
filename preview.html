  <style>
:root{
  --bg:#0d1011; --surface:#171a1b; --surface2:#1d2021; --line:#353735; --text:#f3efe8;
  --muted:#a5a59f; --gold:#d6b67b; --gold-dim:#957b51; --wine:#6f242e;
  --serif:'Marcellus',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  font-family:var(--sans); font-synthesis:none; color:var(--text); background:var(--bg); color-scheme:dark;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-width:320px;min-height:100vh;background:var(--bg)}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}a{color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold);color:#17110a}
.app-shell{min-height:100vh;display:grid;grid-template-columns:253px minmax(0,1fr)}
.sidebar{position:sticky;top:0;max-height:100vh;min-height:100vh;padding:31px 17px 20px 22px;border-right:1px solid #292c2b;background:#101314;display:flex;flex-direction:column;z-index:4}
.logo{display:flex;align-items:center;gap:11px;padding:0 8px 34px;text-decoration:none;color:var(--text)}
.logo-mark{height:39px;width:39px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);border-radius:6px;font:28px var(--serif);background:linear-gradient(145deg,#30251c,#101314)}
.logo-type{font-weight:800;font-size:19px;letter-spacing:.155em;line-height:1}.logo-type small{display:block;color:var(--muted);font-size:8px;letter-spacing:.22em;font-weight:700;margin-top:8px}
.sidebar-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#787c79;padding:8px 15px 13px;font-weight:800}
.nav{display:flex;flex-direction:column;gap:6px}.nav-button{display:flex;align-items:center;gap:12px;padding:13px 14px;background:transparent;border:1px solid transparent;border-radius:7px;color:#b1b2ac;text-align:left;font-size:13px;font-weight:600;transition:.2s}
.nav-button:hover{background:#202424;color:#fff}.nav-button[aria-current="page"]{color:var(--gold);background:#29241f;border-color:#4d4030}.nav-button svg{height:17px;width:17px;flex-shrink:0}
.sidebar-bottom{margin-top:auto;padding:17px 12px 5px;border-top:1px solid var(--line)}
.sidebar-bottom .motto{font-family:var(--serif);line-height:1.55;font-size:17px;color:#d2c0a2}.sidebar-bottom .motto strong{color:#e6c381;font-weight:400}
.sidebar-bottom small{display:block;color:#777e7a;font-size:10px;margin-top:18px}
.main{min-width:0;padding:0 clamp(20px,4.5vw,76px) 55px;max-width:1570px;width:100%;margin:auto}
.topbar{height:97px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292b2a;gap:12px}
.topbar-date{display:flex;align-items:center;gap:12px;color:#a8aaa5;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:capitalize}
.topbar-date svg{height:16px;width:16px;color:var(--gold)}
.pill-status{border:1px solid #4b4335;border-radius:99px;padding:9px 13px;color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;background:#211e19;white-space:nowrap}
.page-title{font:clamp(34px,4vw,54px)/1.12 var(--serif);margin:28px 0 8px;letter-spacing:-.035em;font-weight:400}.page-desc{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 25px;max-width:760px}
.eyebrow{font-weight:800;color:var(--gold);font-size:10px;letter-spacing:.28em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:19px;height:1px;background:currentColor}
.hero{margin:32px 0 27px;position:relative;min-height:334px;border:1px solid #694639;border-radius:11px;overflow:hidden;background:radial-gradient(circle at 79% 55%,#4d2830 0%,#261b1d 28%,transparent 55%),linear-gradient(125deg,#211a19,#141718 78%)}
.hero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0,transparent 5px,#fff1 6px,#fff0 7px);pointer-events:none}
.hero-inner{position:relative;z-index:2;padding:45px clamp(25px,4vw,65px);width:min(100%,640px)}
.hero h1{font:clamp(43px,5.3vw,73px)/1.06 var(--serif);margin:16px 0 14px;letter-spacing:-.045em;font-weight:400}
.hero h1 em{font-style:normal;color:#e0b981}.hero p{font-size:14px;line-height:1.8;color:#c6c0b9;max-width:440px;margin:0 0 25px}
.hero-art{position:absolute;right:5%;top:50%;width:min(31vw,350px);height:min(31vw,350px);transform:translateY(-50%);border:1px solid #bc8f5340;border-radius:50%;display:grid;place-items:center;pointer-events:none}
.hero-art:before,.hero-art:after{content:'';position:absolute;inset:11%;border:1px solid #be98653e;border-radius:50%}.hero-art:after{inset:23%;border-color:#be98652b}
.hero-cross{font:clamp(115px,17vw,230px) var(--serif);color:#c9a165;text-shadow:0 0 70px #e4a85850;line-height:1;transform:translateY(-7px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:6px;font-weight:800;letter-spacing:.035em;font-size:12px;min-height:43px;padding:11px 17px;border:1px solid #8f754f;background:linear-gradient(#dabc87,#cda96d);color:#1b1712;transition:transform .15s,filter .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn svg{width:16px;height:16px}.btn-ghost{background:transparent;color:var(--gold);border:1px solid #68543b}.btn-muted{background:#272929;border-color:#444744;color:#ddd9d0}.btn-small{padding:7px 12px;min-height:35px;font-size:11px}
.grid-2{display:grid;grid-template-columns:1.12fr .88fr;gap:19px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:21px 0 14px}
.section-head h2{font:24px var(--serif);margin:0;letter-spacing:-.02em}.section-head a,.link-button{font-size:12px;color:var(--gold);background:none;border:0;padding:8px 0;text-decoration:none;font-weight:700}
.card{background:#181b1c;border:1px solid #373937;border-radius:10px;padding:22px;min-width:0}.card-title{font:23px/1.25 var(--serif);margin:8px 0 12px}.card p{font-size:13px;color:#b5b6b0;line-height:1.75}
.card-meta{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.rosary-feature{padding:0;overflow:hidden;display:grid;grid-template-columns:145px minmax(0,1fr);min-height:210px}
.feature-art{background:linear-gradient(155deg,#35231f,#111516);display:flex;align-items:center;justify-content:center;overflow:hidden}
.feature-art img{height:180px;width:140px;object-fit:contain;filter:saturate(.86)}.feature-body{padding:24px 23px}
.progress{height:5px;background:#363838;border-radius:5px;overflow:hidden;margin:16px 0 8px}.progress-fill{background:linear-gradient(90deg,#98774b,#e8cc95);height:100%;border-radius:4px;transition:width .2s}.progress-label{font-size:11px;color:#939790}
.truth-card{background:linear-gradient(145deg,#322025,#20191c 68%);border-color:#573740;display:flex;flex-direction:column;justify-content:space-between;min-height:210px}
.quote-mark{font-size:38px;line-height:1;font-family:Georgia,serif;color:#c79c62}.truth-card blockquote{font:clamp(16px,1.4vw,20px)/1.52 var(--serif);color:#efdfcb;margin:5px 0 16px}.truth-card .card-meta{color:#d3a9a2}
.stats{margin-top:20px}.stat{display:flex;flex-direction:column;gap:4px;min-height:107px;justify-content:center}.stat-value{font:33px var(--serif);color:#e1bf85}.stat-label{color:#9e9f9a;font-size:12px}
.kicker-line{height:1px;background:#383a37;margin:25px 0}
.group-picker{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 22px}.group-button{border:1px solid #454540;border-radius:6px;background:#202322;color:#adaea8;font-size:12px;padding:10px 14px;font-weight:700}.group-button.active{border-color:#c5a369;color:#e9c78c;background:#3a3026}
.mystery-layout{display:grid;grid-template-columns:minmax(260px,.87fr) minmax(0,1.13fr);gap:20px}
.mystery-visual{background:radial-gradient(circle at 50% 40%,#392b27,#161a1b 70%);border:1px solid #66513e;min-height:430px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:27px;text-align:center}
.mystery-visual img{width:100%;max-width:280px;max-height:290px;object-fit:contain}.mystery-visual .eyebrow:before{display:none}.mystery-visual h2{font:25px/1.3 var(--serif);max-width:360px;margin:13px 0 4px}.mystery-visual small{color:#cfb184;font-size:12px}
.mystery-detail{display:flex;flex-direction:column;gap:17px}.mystery-detail .card{padding:23px}.readable{font-size:14px;color:#c1c1ba;line-height:1.85;margin:12px 0}.confront{font:clamp(20px,2.1vw,26px)/1.45 var(--serif);color:#eee1d2;margin:14px 0}.question{color:#d0b286;font-size:13px;line-height:1.7}
.action-line{display:flex;align-items:flex-start;gap:10px;color:#d6c9b1;font-size:13px;line-height:1.55;padding:14px 15px;background:#292721;border:1px solid #52432f;border-radius:7px;margin-top:15px}.action-line svg{width:18px;height:18px;flex-shrink:0;color:var(--gold)}
.decade-panel{margin-top:22px;border:1px solid #4a4439;background:#242322;border-radius:10px;padding:21px}.decade-header{display:flex;justify-content:space-between;gap:10px;align-items:center}
.decade-header strong{font:20px var(--serif)}.count-bubbles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 18px}.bead{width:22px;height:22px;border:1px solid #7c6b4d;border-radius:50%;background:#33302a;transition:.2s}.bead.done{background:var(--gold);box-shadow:0 0 14px #d9b87644}.decade-buttons{display:flex;gap:10px;flex-wrap:wrap}
.stepper{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.step{height:38px;width:38px;border-radius:50%;display:grid;place-items:center;border:1px solid #51483c;background:#202222;color:#b6aba0;font-size:12px;font-weight:800}.step.current{background:#6d5338;color:#fff;border-color:var(--gold)}.step.finished{background:#2a4036;color:#c0e4c6;border-color:#4e795d}
.prayer-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.prayer-card summary{font-weight:700;color:#e3c898;cursor:pointer;font-size:13px}.prayer-card p{white-space:pre-line;font-size:13px;line-height:1.9;color:#c9cac5}
.truth-large{background:linear-gradient(140deg,#382129,#151718 70%);border:1px solid #694049;border-radius:12px;padding:clamp(23px,4vw,48px);position:relative;overflow:hidden}.truth-large:after{content:'✝';position:absolute;right:-11px;bottom:-90px;color:#b48b6030;font:240px var(--serif);pointer-events:none}
.truth-large h2{font:clamp(30px,4vw,53px)/1.18 var(--serif);margin:13px 0 20px;max-width:730px}.truth-large blockquote{font:clamp(21px,2.8vw,33px)/1.44 var(--serif);color:#f1e1ce;margin:22px 0;max-width:850px;position:relative;z-index:1}.truth-large p{max-width:690px}.truth-large .btn{position:relative;z-index:2}
.truth-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.filter-tag{border:1px solid #67513e;border-radius:99px;color:#d7bb92;font-size:11px;padding:7px 11px;font-weight:700}
.checklist{display:flex;flex-direction:column;gap:11px}.checkrow{display:flex;align-items:flex-start;gap:13px;background:#202323;border:1px solid #3d403d;padding:17px;border-radius:7px;cursor:pointer;transition:.15s}.checkrow:hover{border-color:#73664e}.checkrow input{appearance:none;flex-shrink:0;width:20px;height:20px;border:1px solid #958366;border-radius:5px;background:#141615;margin:2px 0 0;display:grid;place-items:center}.checkrow input:checked{background:#cda86e;border-color:#cda86e}.checkrow input:checked:after{content:'✓';color:#171818;font-weight:800;font-size:15px}.checkrow span{font-size:13px;color:#dfdfd8;line-height:1.6}.checkrow small{font-size:11px;color:#9ca09b;display:block;margin-top:4px}
.checkrow:has(input:checked) span{color:#e0c99f}.completion-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:17px 0;font-size:12px;color:var(--muted)}
textarea{resize:vertical;width:100%;border:1px solid #51514a;background:#111515;color:var(--text);border-radius:7px;padding:16px;line-height:1.65;min-height:140px;font-size:13px} textarea::placeholder{color:#7a807c}
.input-label{font-size:12px;font-weight:800;color:#d7c3a1;display:block;margin-bottom:10px}
.note{padding:18px;border:1px solid #3f413d;background:#1d2020;border-radius:8px;margin-top:12px}.note-date{color:#c7aa76;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.note p{white-space:pre-wrap;overflow-wrap:anywhere;color:#d0d0c9;font-size:13px;line-height:1.7;margin:9px 0}
.empty{border:1px dashed #494c47;border-radius:9px;padding:34px 24px;text-align:center;color:#a8aaa3;font-size:13px;line-height:1.7}
.disclaimer{font-size:11px;color:#8a918b;line-height:1.75;margin:18px 0}.two-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}
.mobile-nav{display:none}.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#d8b67e;letter-spacing:.3em;font-size:11px}.boot-cross{font:85px var(--serif)}
@media(max-width:1130px){.main{padding:0 30px 50px}.sidebar{padding:25px 11px 18px}.app-shell{grid-template-columns:210px minmax(0,1fr)}.hero-art{right:0}.hero-inner{width:80%}.grid-2{grid-template-columns:1fr}.truth-card{min-height:unset}}
@media(max-width:760px){.app-shell{display:block}.sidebar{display:none}.main{padding:0 16px 98px}.topbar{height:67px}.topbar-date{font-size:11px}.pill-status{font-size:9px;padding:7px 9px}.hero{min-height:335px;margin-top:19px}.hero-inner{padding:28px 22px;width:100%;background:linear-gradient(90deg,#211a19 40%,#211a1999 100%)}.hero h1{font-size:48px}.hero p{font-size:12px;max-width:320px}.hero-art{right:-60px;width:230px;height:230px;opacity:.31}.hero-cross{font-size:145px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{min-height:87px;padding:10px}.stat-value{font-size:28px}.stat-label{font-size:10px}.section-head h2{font-size:22px}.rosary-feature{grid-template-columns:108px minmax(0,1fr)}.feature-art img{width:100px}.feature-body{padding:17px 13px}.feature-body .card-title{font-size:19px}.feature-body p{font-size:11px}.mystery-layout{grid-template-columns:1fr}.mystery-visual{min-height:300px;padding:19px}.mystery-visual img{max-height:175px}.mystery-visual h2{font-size:23px}.prayer-list{grid-template-columns:1fr}.page-title{font-size:40px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:10;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#111414f5;border-top:1px solid #42413b;backdrop-filter:blur(13px)}.mobile-nav button{border:0;background:transparent;color:#919792;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:9px;font-weight:700}.mobile-nav button[aria-current="page"]{color:#e0ba7e}.mobile-nav svg{width:19px;height:19px}.truth-large h2{font-size:32px}.truth-large blockquote{font-size:23px}}
@media(max-width:370px){.hero h1{font-size:42px}.topbar-date{font-size:10px}.pill-status{font-size:8px}.grid-3{grid-template-columns:1fr 1fr}.grid-3>.stat:last-child{grid-column:span 2}.feature-art{display:none}.rosary-feature{display:block}.decade-buttons .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Versão 2: identidade firme e ações sem desculpas */
.mode-switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:.18s;max-width:55%}
.mode-switch svg{width:14px;height:14px}.mode-switch.on{background:#451d24;color:#f4cfab;border-color:#a95c57;box-shadow:0 0 0 2px #551e241f}
.mode-switch:hover{filter:brightness(1.19)}
.battle-cry{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:#24171b;border:1px solid #71373e;border-left:4px solid #bc6e61;border-radius:7px;padding:13px 18px;margin:-4px 0 22px;font-size:11px;color:#d4c1b7;letter-spacing:.02em}
.battle-cry strong{color:#f0d7ba;letter-spacing:.06em}.battle-cry .battle-dot{color:#dfab73;font-size:17px}
.prayer-response{padding:15px 18px;margin-top:16px;border-left:3px solid #c5a06e;background:#262522;border-radius:0 6px 6px 0}
.prayer-response span{font-size:10px;font-weight:800;letter-spacing:.15em;color:#dec494}
.prayer-response p{font-style:italic;color:#d5cbb9;font-size:13px;line-height:1.75;margin:8px 0 0}
.mission-commit{margin-top:22px;padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid #655042;border-radius:8px;background:#261f1e}
.mission-commit p{margin:7px 0 0;font-size:12px;color:#c3b8aa;line-height:1.6}
@media(max-width:760px){.mode-switch{padding:9px 9px;font-size:9px;letter-spacing:.02em;white-space:normal;text-align:center}.mode-switch svg{display:none}.battle-cry{gap:7px}.battle-cry strong{font-size:10px}.mission-commit{flex-direction:column;align-items:stretch}.mission-commit .btn{width:100%}}


/* Sagrada Escritura e devocionário dos santos */
.scripture-verse{border:1px solid #675741;border-radius:8px;background:linear-gradient(120deg,#332923,#201f1e);padding:20px;margin-bottom:23px}
.scripture-verse blockquote{font:clamp(19px,2.1vw,25px)/1.48 var(--serif);color:#f4dfb4;margin:13px 0}
.scripture-verse small{font-size:10px;color:#b6a48d;line-height:1.6}
.devotional-hero{margin:27px 0 23px;padding:25px 28px 22px;border:1px solid #69543b;border-radius:12px;background:radial-gradient(circle at 91% 50%,#3b2b29,#15191a 55%);position:relative;overflow:hidden;min-height:176px}
.devotional-hero .page-title{margin:15px 0 14px}.devotional-hero .page-desc{max-width:660px;margin-bottom:0}
.angel-mark{position:absolute;right:28px;top:45px;width:115px;height:115px;border:1px solid #bda16a5e;border-radius:50%;display:grid;place-items:center;opacity:.5;pointer-events:none}
.angel-mark svg{width:64px;height:64px;color:#e4c78b}
.devotion-filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 25px}
.devotion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}

.devotion-card[open] summary:after{content:'−'}
.devotion-card summary strong{display:block;color:#f0ddbe;font:20px/1.3 var(--serif)}
.devotion-card summary small{display:block;color:#aaa59b;font-size:10px;margin-top:8px}
.devotion-symbol{width:43px;height:43px;border:1px solid #7b654b;border-radius:50%;color:var(--gold);background:#2f2a24;display:grid;place-items:center;font-size:21px;flex-shrink:0}
.devotion-symbol svg{height:25px;width:25px}
.devotion-text{border-top:1px solid #454039;padding:20px 22px;line-height:1.95;white-space:pre-line;color:#e2d6c6;font-size:14px}
.devotion-link{display:inline-block;margin:0 22px 22px;font-size:12px}
.devotional-note{margin-top:23px}
.devotional-source{font-size:11px!important;line-height:1.7}
@media(max-width:880px){.devotion-grid{grid-template-columns:1fr}.angel-mark{opacity:.24}}
@media(max-width:760px){.mobile-nav button{font-size:8px;padding:0 1px}.mobile-nav svg{width:18px;height:18px}.devotional-hero{padding:22px 18px}.devotional-hero .page-desc{position:relative;z-index:1}.angel-mark{right:-15px;top:5px}}


/* CUIÚDO: coragem que se converte em ação. */

html,body{min-height:100%;overflow-x:hidden}

.hero-attack strong{color:#ffe0a5}
.battle-cry{border-radius:11px;background:#2b1e20;border-color:#71503d;border-left:4px solid #d6a96f}
.manifesto-strip{display:flex;align-items:center;gap:19px;margin:17px 0 24px;padding:19px 22px;border-radius:12px;background:linear-gradient(120deg,#272b2a,#23221e);border:1px solid #564d39}
.manifesto-index{font-family:var(--serif);font-size:31px;color:var(--gold);line-height:1}
.manifesto-strip strong{font-size:12px;letter-spacing:.12em;color:#f2deb4}
.manifesto-strip p{font-size:12px;color:#aea99d;line-height:1.65;margin:5px 0 0}
.manifesto-cross{margin-left:auto;color:#b59d70;font-size:29px}
.card,.truth-large,.mystery-visual,.decade-panel,.devotion-card{box-shadow:0 8px 35px #00000021}
.card{border-radius:13px}
.prayer-card{transition:border-color .16s,transform .16s}
.prayer-card:hover,.devotion-card:hover{border-color:#917b5e}
.group-button{border-radius:99px;min-height:38px}
.scripture-verse{background:linear-gradient(135deg,#393026,#242421);border:1px solid #8d7454;border-radius:12px;box-shadow:inset 4px 0 0 var(--gold);padding:23px;margin-bottom:25px}
.scripture-top,.scripture-footer{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap}
.scripture-verse blockquote{font:clamp(22px,2.3vw,29px)/1.55 var(--serif);margin:19px 0 16px;color:#f3dfba}
.scripture-footer{font-size:11px;color:#d6c6a7}.scripture-footer a{color:#efcb87;text-decoration:underline;text-underline-offset:3px}
.verse-switch{display:inline-flex;gap:3px;padding:3px;background:#181b1b;border:1px solid #71634a;border-radius:30px}
.verse-switch button{border:0;background:transparent;color:#b5b2a8;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:800;min-width:38px}
.verse-switch button.active{background:var(--gold);color:#251c13}
.daily-scripture{margin:22px 0 0;border:1px solid #514b3c;border-radius:12px;background:linear-gradient(120deg,#292825,#24201e);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.daily-scripture p{font:clamp(18px,2vw,24px)/1.45 var(--serif);color:#ecdbc0;margin:9px 0 6px}
.daily-scripture small{color:#c2ad87;font-size:11px}
.truth-card{border-color:#765047}
.disclaimer{max-width:1000px}
@media(max-width:760px){

}

}

<script>
// CUIÚDO — Conteúdo de meditação original, com referências bíblicas.

const groups = {
  gozosos: {
    title: 'Mistérios Gozosos', short: 'Gozosos', days: 'Segundas e sábados', eyebrow: 'A coragem de dizer sim', theme: 'Nascimento da esperança', color: '#d9b777',
    mysteries: [
      {id:'anunciacao',title:'A Anunciação do Anjo a Maria',ref:'Lucas 1,26–38',summary:'Maria acolhe o chamado de Deus mesmo sem conhecer todos os caminhos.',hard:'Você quer garantias para obedecer? Maria disse sim antes de enxergar o final. Pare de usar o medo como desculpa para ficar parado.',question:'Em que decisão você está adiando um sim honesto?',action:'Assuma hoje uma responsabilidade que você tem evitado.',symbol:'lily'},
      {id:'visitacao',title:'A Visitação de Maria a Isabel',ref:'Lucas 1,39–56',summary:'Maria se levanta, parte apressadamente e coloca sua fé a serviço.',hard:'Fé que não se move vira discurso bonito. Você fala de amor, mas quando foi a última vez que se levantou para ajudar alguém?',question:'Sua fé beneficia alguém além de você?',action:'Faça um serviço concreto por alguém, sem anunciar.',symbol:'heart-hand'},
      {id:'nascimento',title:'O Nascimento de Jesus',ref:'Lucas 2,1–20',summary:'O Salvador nasce na humildade, longe dos privilégios que o mundo costuma admirar.',hard:'Você se acha importante demais para começar pequeno? O próprio Cristo veio na pobreza. Desça do pedestal e comece com o que tem.',question:'Qual vaidade está impedindo seu primeiro passo?',action:'Conclua uma tarefa simples com humildade e capricho.',symbol:'star'},
      {id:'apresentacao',title:'A Apresentação de Jesus no Templo',ref:'Lucas 2,22–35',summary:'Maria e José apresentam Jesus, vivendo a fidelidade nas pequenas obrigações.',hard:'Você quer uma missão grandiosa, mas despreza seus compromissos básicos. Santidade também é cumprir o dever quando ninguém está vendo.',question:'Que dever cotidiano você trata com descaso?',action:'Cumpra pontualmente a obrigação mais negligenciada do dia.',symbol:'candle'},
      {id:'encontro',title:'O Encontro de Jesus no Templo',ref:'Lucas 2,41–52',summary:'Após procurá-lo com aflição, Maria e José encontram Jesus no Templo.',hard:'Você diz que perdeu o rumo, mas não reserva cinco minutos para buscar Cristo. O problema talvez não seja falta de sinal, mas falta de prioridade.',question:'Onde Deus está na sua agenda real?',action:'Separe dez minutos sem telas para oração e leitura do Evangelho.',symbol:'book'}
    ]
  },
  dolorosos: {
    title: 'Mistérios Dolorosos', short: 'Dolorosos', days: 'Terças e sextas', eyebrow: 'Fidelidade quando dói', theme: 'A escola da cruz', color: '#c67f78',
    mysteries: [
      {id:'agonia',title:'A Agonia de Jesus no Horto',ref:'Lucas 22,39–46',summary:'Jesus enfrenta a angústia em oração e entrega sua vontade ao Pai.',hard:'Coragem não é sentir nada; é fazer o certo mesmo tremendo. Pare de exigir que o medo desapareça antes de agir.',question:'Qual compromisso justo você evita por medo?',action:'Dê hoje o primeiro passo em algo difícil, mas necessário.',symbol:'chalice'},
      {id:'flagelacao',title:'A Flagelação de Jesus',ref:'João 19,1',summary:'Jesus suporta a violência sem abandonar o amor nem a sua missão.',hard:'Você quer um caminho sem esforço? A vida cristã não é uma máquina de conforto. Chega de entregar sua vontade à primeira dificuldade.',question:'Qual desconforto pequeno tem governado suas escolhas?',action:'Faça sua obrigação sem reclamar e ofereça esse esforço.',symbol:'cord'},
      {id:'espinhos',title:'A Coroação de Espinhos',ref:'Mateus 27,27–31',summary:'Cristo é ridicularizado e coroado de espinhos.',hard:'Enquanto Cristo aceita a humilhação por amor, você sacrifica a paz para vencer discussões inúteis. Seu orgulho não é um trono; é uma prisão.',question:'De quem você precisa parar de buscar aprovação?',action:'Recuse hoje uma discussão movida apenas pelo ego.',symbol:'crown'},
      {id:'cruz',title:'Jesus Carrega a Cruz',ref:'Lucas 23,26–32',summary:'Jesus caminha para o Calvário e Simão de Cirene o ajuda a levar a cruz.',hard:'Não espere que alguém viva sua responsabilidade por você. Levante, carregue o que lhe cabe e aceite ajuda sem fazer do sofrimento um espetáculo.',question:'Você está fugindo de qual responsabilidade?',action:'Resolva uma pendência objetiva que depende de você.',symbol:'cross'},
      {id:'crucificacao',title:'A Crucificação e Morte de Jesus',ref:'João 19,25–30',summary:'Na cruz, Cristo entrega a própria vida por amor.',hard:'O amor não é só sentimento bonito; exige entrega e fidelidade. Pare de chamar de amor aquilo que só funciona quando você ganha algo.',question:'Seu amor se transforma em sacrifício concreto?',action:'Faça um gesto generoso que custe tempo ou comodidade.',symbol:'cross-rays'}
    ]
  },
  gloriosos: {
    title: 'Mistérios Gloriosos', short: 'Gloriosos', days: 'Quartas e domingos', eyebrow: 'A esperança vence', theme: 'Vida nova em Cristo', color: '#d7c58f',
    mysteries: [
      {id:'ressurreicao',title:'A Ressurreição de Jesus',ref:'Mateus 28,1–10',summary:'O túmulo vazio anuncia que Cristo ressuscitou.',hard:'Seu fracasso de ontem não é desculpa para desistir hoje. Arrependa-se, recomece e pare de tratar a derrota como identidade.',question:'Qual erro você precisa enfrentar e corrigir?',action:'Recomece uma boa prática que abandonou.',symbol:'sun'},
      {id:'ascensao',title:'A Ascensão de Jesus ao Céu',ref:'Atos 1,6–11',summary:'Cristo ascende e confia aos discípulos a continuidade da missão.',hard:'Ficar olhando para o céu não substitui a missão na terra. Reze de verdade e depois faça o trabalho que está nas suas mãos.',question:'Que missão concreta está esquecida?',action:'Dê um passo verificável em seu dever principal.',symbol:'up'},
      {id:'pentecostes',title:'A Vinda do Espírito Santo',ref:'Atos 2,1–13',summary:'O Espírito Santo fortalece os discípulos para anunciar o Evangelho.',hard:'Você pede coragem e vive se escondendo atrás da opinião alheia. Faça o bem com firmeza, sem transformar a fé em teatro.',question:'O medo do julgamento tem calado sua consciência?',action:'Defenda uma atitude correta com respeito e coragem.',symbol:'flame'},
      {id:'assuncao',title:'A Assunção de Nossa Senhora',ref:'Apocalipse 12,1 (imagem simbólica); tradição da Igreja',summary:'A Igreja celebra Maria elevada à glória celeste por graça de Deus.',hard:'Você foi chamado ao céu, mas entrega horas preciosas ao que não alimenta nem a alma nem a vida. Cuide do destino eterno sem abandonar seus deveres de hoje.',question:'O que ocupa seu coração em lugar desproporcional?',action:'Abra mão de uma distração e use esse tempo para algo bom.',symbol:'star-halo'},
      {id:'coroacao',title:'A Coroação de Maria no Céu',ref:'Apocalipse 12,1 (imagem simbólica); tradição da Igreja',summary:'A devoção cristã contempla Maria glorificada junto a seu Filho.',hard:'Grandeza diante de Deus nasce da humildade, não do aplauso. Você quer ser admirado ou quer realmente ser fiel?',question:'Qual atitude sua busca mais aparência que verdade?',action:'Pratique uma virtude em segredo.',symbol:'crown'}
    ]
  },

    title: 'Mistérios Luminosos', short: 'Luminosos', days: 'Quintas', eyebrow: 'A verdade ilumina', theme: 'O caminho do discípulo', color: '#dec58b',
    mysteries: [

 <section class="mystery-layout"><div class="mystery-visual"><div class="eyebrow">${state.mystery+1}º mistério • ${g.short}</div><img src="./assets/misterios/${m.id}.svg" alt="Arte simbólica: ${escapeHtml(m.title)}"/><h2>${m.title}</h2><small>${m.ref}</small></div>
 <div class="mystery-detail"><div class="card"><div class="scripture-verse"><div class="scripture-top"><span class="card-meta">ESCRITURA SAGRADA · ${escapeHtml(versiculo.ref)}</span><div class="verse-switch" role="group" aria-label="Idioma do versículo"><button type="button" data-action="verse-lang" data-lang="pt" aria-pressed="${state.verseLang==='pt'}" class="${state.verseLang==='pt'?'active':''}">PT</button><button type="button" data-action="verse-lang" data-lang="en" aria-pressed="${state.verseLang==='en'}" class="${state.verseLang==='en'?'active':''}">EN</button></div></div><blockquote lang="${state.verseLang==='pt'?'pt-BR':'en'}">“${escapeHtml(scriptureText(versiculo))}”</blockquote><div class="scripture-footer"><span>${state.verseLang==='pt'?'Pe. Antônio Pereira de Figueiredo':'Douay-Rheims 1899'} · ${versiculo.excerptPt&&state.verseLang==='pt'?'Excerto literal · ':''}Domínio público</span><a href="${state.verseLang==='pt'?versiculo.ptSource:versiculo.enSource}" rel="noopener noreferrer" target="_blank">Ler capítulo completo ↗</a></div></div><div class="card-meta">Meditação do Evangelho</div><p class="readable">${m.summary}</p><div class="kicker-line"></div><div class="card-meta">${state.mode==='brutal'?'SEM DESCULPAS · A VERDADE QUE DÓI':'Tapa na cara da realidade'}</div><blockquote class="confront">“${escapeHtml(mm.hard)}”</blockquote><div class="question"><strong>Exame de consciência:</strong> ${escapeHtml(mm.question)}</div>${mm.prayer?`<div class="prayer-response"><span>ORAÇÃO DE COMBATE</span><p>${escapeHtml(mm.prayer)}</p></div>`:''}</div></div></section>
 <section class="decade-panel"><div class="decade-header"><strong>Contador da dezena</strong><span class="card-meta">${n} / 10 Ave-Marias</span></div><p style="color:#b5b7b0;font-size:12px;line-height:1.7">Antes de cada dezena, reze um Pai-Nosso. Reze 10 Ave-Marias e encerre com o Glória ao Pai. O contador registra apenas as Ave-Marias.</p><div class="count-bubbles" aria-label="${n} de 10 Ave-Marias rezadas">${Array.from({length:10},(_,i)=>`<span class="bead ${i<n?'done':''}" aria-hidden="true"></span>`).join('')}</div><div class="decade-buttons"><button class="btn" data-action="add-bead" ${n>=10?'disabled':''}>${icon('plus')} ${n===10?'Dezena concluída':'Rezei uma Ave-Maria'}</button><button class="btn btn-muted" data-action="undo-bead" ${n===0?'disabled':''}>Desfazer 1</button><button class="btn btn-ghost" data-action="reset-decade">Reiniciar dezena</button></div><div class="stepper" role="group" aria-label="Selecionar mistério">${g.mysteries.map((x,i)=>`<button class="step ${i===state.mystery?'current':''} ${arr[i]===10?'finished':''}" data-action="mystery" data-index="${i}" aria-label="${i+1}º mistério: ${x.title}" aria-current="${i===state.mystery?'step':'false'}">${arr[i]===10?icon('check'):i+1}</button>`).join('')}</div><div class="two-buttons"><button class="btn btn-muted" data-action="prev-mystery" ${state.mystery===0?'disabled':''}>${icon('arrowLeft')} Anterior</button><button class="btn btn-ghost" data-action="next-mystery" ${state.mystery===4?'disabled':''}>Próximo mistério ${icon('arrow')}</button></div>${arr.every(x=>x===10)?'<div class="action-line">'+icon('check')+'<span>Terço concluído! Ofereça esta oração a Deus e leve um gesto de amor ao seu dia.</span></div>':''}</section>
 <div class="section-head"><h2>Orações do terço</h2></div><p class="page-desc">Comece com o Sinal da Cruz e o Credo; reze um Pai-Nosso, três Ave-Marias e um Glória. Em cada mistério, reze um Pai-Nosso, dez Ave-Marias e um Glória. Conclua com a Salve-Rainha.</p><section class="prayer-list">${prayers.map((p,i)=>`<details class="card prayer-card" ${i===2?'open':''}><summary>${escapeHtml(p.name)}</summary><p>${escapeHtml(p.text)}</p></details>`).join('')}</section><div class="section-head"><h2>Ladainha e orações especiais</h2></div><section class="prayer-list"><details class="card prayer-card" id="ladainha"><summary>Ladainha de Nossa Senhora — versão breve</summary><p>${escapeHtml(ladainhaBreve.join('\n'))}</p><p class="devotional-source">Esta é uma ladainha autoral breve. <a target="_blank" rel="noopener noreferrer" href="${fonteLadainhaOficial}">Ler a Ladainha Lauretana completa no Vaticano</a>.</p></details><details class="card prayer-card"><summary>Oração a São Miguel Arcanjo</summary><p>${escapeHtml(oracoesDevocionario.find(x=>x.id==='miguel').text)}</p><p><a href="#" data-action="navigate" data-tab="devocionario">Mais orações aos santos e anjos ${icon('arrow')}</a></p></details></section>`;
}
function truth(){const t=getTruth();return `<h1 class="page-title">${state.mode==='brutal'?'SEM DESCULPAS.':'Tapa na cara da realidade'}</h1><p class="page-desc">${state.mode==='brutal'?'VAI PRA CIMA. SEJA CUIÚDO. O CONFRONTO NÃO É CONTRA VOCÊ. É CONTRA AS SUAS DESCULPAS. Examine-se com coragem e faça o que é certo, sem vender a alma ao comodismo.':'Palavras firmes para sacudir a consciência, sem destruir a dignidade. A verdade conduz à misericórdia e à ação.'}</p>
 <section class="truth-large"><div class="eyebrow">Confronto nº ${String(((dailyIndex()+state.truthOffset)%truthDeck().length)+1).padStart(2,'0')} • ${escapeHtml(t.topic)}</div><h2>${escapeHtml(t.title)}</h2><div class="quote-mark">“</div><blockquote>${escapeHtml(t.quote)}</blockquote><div class="kicker-line"></div><p class="readable"><strong style="color:var(--gold)">A verdade:</strong> ${escapeHtml(t.truth)}</p><div class="action-line">${icon('target')}<span><strong>Sua missão:</strong> ${escapeHtml(t.action)}</span></div><div class="truth-footer"><span class="filter-tag">${escapeHtml(t.ref)}</span><span class="filter-tag">Sem desculpas. Com caridade.</span></div><div class="mission-commit"><div><span class="card-meta">NÃO É FRASE BONITA. É DECISÃO.</span><p>${missionDone()?'Você marcou esta missão como cumprida. Continue com humildade.':'Só marque depois que cumprir a ação de verdade. Sem mentir para si mesmo.'}</p></div>${missionButton()}</div><div class="two-buttons"><button class="btn btn-ghost" data-action="next-truth">Outro confronto ${icon('arrow')}</button><button class="btn btn-ghost" data-action="navigate" data-tab="desafios">Partir para a ação ${icon('arrow')}</button></div></section>`;}
function challenges(){const checks=getChecks();const done=checks.filter(Boolean).length;return `<h1 class="page-title">VAI PRA CIMA. SEJA CUIÚDO.</h1><p class="page-desc">Fé sem atitude não é projeto de vida. Tem que fazer acontecer! Quatro compromissos simples para hoje. Sua vida não muda só porque você pensou bonito. Faça o bem possível, sem espetáculo e sem fugir das responsabilidades.</p><div class="card" style="margin-bottom:20px"><div class="decade-header"><div><div class="card-meta">Disciplina do dia</div><h2 class="card-title">${done} de 4 compromissos cumpridos</h2></div><div class="stat-value">${done===4?'✝':`${Math.round(done/4*100)}%`}</div></div><div class="progress"><div class="progress-fill" style="width:${done*25}%"></div></div><p>${done===4?'Você cumpriu os compromissos de hoje. Agradeça a Deus e mantenha o coração humilde.':'A prática diária, mesmo pequena, constrói constância.'}</p></div>
 <section class="checklist">${baseChallenges.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-kind="challenge" data-index="${i}" ${checks[i]?'checked':''}/><span><strong>${escapeHtml(x.label)}</strong><small>${escapeHtml(x.details)} • ${escapeHtml(x.type)}</small></span></label>`).join('')}</section><div class="section-head"><h2>Missão extra</h2></div><div class="card"><div class="card-meta">Não adie</div><h3 class="card-title">${escapeHtml(getTruth().action)}</h3><p>Esta missão é uma proposta de ação, não uma cobrança impossível. Priorize o que é seguro, justo e compatível com seus deveres.</p></div>`;}
function examine(){const arr=getExamine();const selected=arr.filter(Boolean).length;return `<h1 class="page-title">Exame de consciência</h1><p class="page-desc">Não é um tribunal para esmagar você. É um encontro honesto com a verdade diante de Deus. Marque os pontos que precisam de revisão, reze e planeje um passo de conversão.</p>
 <div class="card" style="margin-bottom:18px"><div class="card-meta">Pelo amor à verdade</div><h2 class="card-title">“Senhor, mostra-me o que preciso mudar.”</h2><p>Faça silêncio. Examine atitudes, omissões e intenções. Diferencie tentações de escolhas conscientes; procure o sacramento da Reconciliação quando necessário.</p></div>
 <section class="checklist">${examineItems.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-kind="examine" data-index="${i}" ${arr[i]?'checked':''}/><span>${escapeHtml(x)}</span></label>`).join('')}</section>
 <div class="completion-row"><span>${selected} ponto(s) selecionado(s) para refletir</span><span>Privado • salvo somente neste navegador</span></div>
 <div class="card"><div class="card-meta">Oração de arrependimento</div><blockquote class="confront" style="font-size:21px">Meu Deus, reconheço minhas faltas. Dai-me humildade para pedir perdão, coragem para reparar o mal e força para recomeçar na vossa graça. Amém.</blockquote><p>Se você reconheceu um pecado grave, procure a Confissão sacramental. Nenhum checklist substitui a conversa com um sacerdote.</p><button class="btn btn-ghost" data-action="navigate" data-tab="diario">Registrar meu propósito ${icon('arrow')}</button></div>`;}
function diary(){const notes=Array.isArray(state.notes)?state.notes:[];return `<h1 class="page-title">Diário de conversão</h1><p class="page-desc">A mudança ganha forma quando você assume sua história. Escreva com sinceridade o que precisa enfrentar e qual será seu próximo passo.</p>
 <section class="grid-2"><div class="card"><div class="card-meta">Meu compromisso com a verdade</div><h2 class="card-title">O que eu preciso mudar hoje?</h2><form id="journal-form"><label class="input-label" for="journal-text">Escreva uma reflexão ou resolução concreta</label><textarea id="journal-text" name="journal-text" maxlength="2000" placeholder="Hoje eu percebi que... A partir de agora vou..." required></textarea><div class="two-buttons"><button class="btn" type="submit">${icon('save')} Salvar reflexão</button></div></form><p class="disclaimer">${icon('lock')} Suas anotações ficam apenas no armazenamento local deste navegador. Não escreva dados extremamente sensíveis; limpar os dados do navegador pode apagá-las.</p></div>
 <div class="card"><div class="card-meta">Um princípio inegociável</div><h2 class="card-title">Arrependimento sem atitude vira promessa vazia.</h2><p>Não escreva para impressionar ninguém. Reconheça uma decisão objetiva, possível e caridosa. Amanhã, volte e avalie se cumpriu.</p><div class="action-line">${icon('sun')}<span>Uma queda não torna você incapaz de recomeçar. Graça, oração e um passo de cada vez.</span></div></div></section>
 <div class="section-head"><h2>Reflexões salvas</h2><span class="card-meta">${notes.length} registro(s)</span></div>${notes.length?notes.map((n,i)=>`<article class="note"><div class="decade-header"><span class="note-date">${escapeHtml(new Date(n.time).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}))}</span><button class="link-button" data-action="delete-note" data-index="${i}" aria-label="Excluir esta anotação">${icon('trash')} Excluir</button></div><p>${escapeHtml(n.text)}</p></article>`).join(''):'<div class="empty">Seu diário está vazio. O primeiro passo é admitir a verdade e escolher uma atitude.</div>'}`;}
function devocionario(){
 const filters=[{id:'todos',label:'Todas as orações'},{id:'anjos',label:'Anjos e arcanjos'},{id:'santos',label:'Santos'},{id:'mariana',label:'Nossa Senhora'}];
 const active=filters.some(f=>f.id===state.devFilter)?state.devFilter:'todos';
 const list=oracoesDevocionario.filter(p=>active==='todos'||p.category===active);
 return `<div class="devotional-hero"><span class="eyebrow">CÉU, INTERCESSÃO E COMBATE INTERIOR</span><h1 class="page-title">Santos & Anjos</h1><p class="page-desc">Não adoramos os santos nem os anjos: pedimos sua intercessão diante de Deus. A adoração pertence somente à Santíssima Trindade. Abre uma oração, recolhe o coração e fala com Deus.</p><div class="angel-mark" aria-hidden="true">${icon('angel')}</div></div>
 <div class="devotion-filters" role="group" aria-label="Filtrar orações">${filters.map(f=>`<button class="group-button ${active===f.id?'active':''}" data-action="dev-filter" data-filter="${f.id}" aria-pressed="${active===f.id}">${escapeHtml(f.label)}</button>`).join('')}</div>
 <div class="card-meta" style="margin:0 0 12px">${list.length} ORAÇÕES DISPONÍVEIS · ANJOS RECONHECIDOS NA TRADIÇÃO CATÓLICA</div>
 <section class="devotion-grid">${list.map(p=>`<details class="card devotion-card" id="oracao-${p.id}"><summary><span class="devotion-symbol" aria-hidden="true">${p.category==='anjos'?icon('angel'):p.category==='mariana'?'✝':'✦'}</span><span><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.type)} • ${escapeHtml(p.ref)}</small></span></summary><div class="devotion-text">${escapeHtml(p.text)}</div>${p.source?`<a class="devotion-link" href="${escapeHtml(p.source)}" target="_blank" rel="noopener noreferrer">Fonte e referência devocional ↗</a>`:''}</details>`).join('')}</section>
 <div class="card devotional-note"><h2 class="card-title">Oração não é magia.</h2><p>Os santos intercedem; quem salva é Jesus Cristo. Não há promessa de resultados automáticos, cura garantida ou bênção comprada. A oração verdadeira abre o coração à graça e à conversão.</p><button class="btn btn-ghost" data-action="navigate" data-tab="terco">Voltar ao Santo Terço ${icon('arrow')}</button></div>`;
}
function render(){
 setTheme();
 const pages={inicio:home,terco:rosary,devocionario:devocionario,verdade:truth,desafios:challenges,exame:examine,diario:diary};
 app.innerHTML=renderShell((pages[state.tab]||home)());
 document.title=`${navItems.find(n=>n.id===state.tab)?.label||'Início'} | CUIÚDO`;
}
app.addEventListener('click',evt=>{
 const target=evt.target.closest('[data-action]');if(!target)return;
 const a=target.dataset.action;
 if(a==='navigate') {evt.preventDefault();state.tab=target.dataset.tab;window.scrollTo({top:0,behavior:'instant'});}
 if(a==='group') {state.group=target.dataset.id;state.mystery=0;save();}
 if(a==='dev-filter'){state.devFilter=target.dataset.filter;save();}
 if(a==='mystery')state.mystery=Number(target.dataset.index);
 if(a==='next-mystery')state.mystery=Math.min(4,state.mystery+1);
 if(a==='prev-mystery')state.mystery=Math.max(0,state.mystery-1);
 if(a==='add-bead')changeCount(readProgress()[state.mystery]+1);
 if(a==='undo-bead')changeCount(readProgress()[state.mystery]-1);
 if(a==='reset-decade'&&confirm('Reiniciar a contagem desta dezena?'))changeCount(0);
 if(a==='next-truth')state.truthOffset=(state.truthOffset+1)%truthDeck().length;
 if(a==='toggle-mode'){state.mode=state.mode==='brutal'?'firme':'brutal';state.truthOffset=0;save();}
 if(a==='toggle-theme'){state.theme=state.theme==='light'?'dark':'light';save();}
 if(a==='verse-lang'){state.verseLang=target.dataset.lang==='en'?'en':'pt';save();}
 if(a==='mission-done'){state.missionDays??={};state.missionDays[missionId()]=!missionDone();save();}
 if(a==='delete-note'){
   const i=Number(target.dataset.index);
   if(confirm('Excluir esta reflexão do diário?')){state.notes.splice(i,1);save();}else return;
 }
 render();
});
app.addEventListener('change',evt=>{
 const t=evt.target;if(t.dataset.kind==='challenge'){checkChallenge(Number(t.dataset.index),t.checked);render();}
 if(t.dataset.kind==='examine'){checkExamine(Number(t.dataset.index),t.checked);render();}
});
app.addEventListener('submit',evt=>{
 if(evt.target.id!=='journal-form')return;
 evt.preventDefault();const text=evt.target.querySelector('textarea')?.value.trim();
 if(!text)return;
 state.notes??=[];state.notes.unshift({time:new Date().toISOString(),text:text.slice(0,2000)});state.notes=state.notes.slice(0,100);
 save();render();
});
render();
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});


</script>
</body>
</html>
