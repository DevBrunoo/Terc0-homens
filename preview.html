<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090a" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="CUIÚDO: fé, coragem e ação. Feed dark com São Miguel e cowboys, terço diário, Bíblia PT/EN, orações e desafios." />
  <meta property="og:title" content="CUIÚDO — Fé, Coragem e Ação" />
  <meta property="og:description" content="TEM QUE SER CUIÚDO. Fé em Deus e pé na tábua." />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
  try {
    const saved=JSON.parse(localStorage.getItem('cuiudo-v1')||'{}');
    const preference=saved.designVersion==='combat-v9'&&['light','dark','system'].includes(saved.theme)?saved.theme:'dark';
    const active=preference==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;
    document.documentElement.dataset.theme=active;
    document.querySelector('meta[name="theme-color"]').content=active==='light'?'#f7f7f5':'#08090a';
  } catch { document.documentElement.dataset.theme='dark'; }
  </script>
  <style>
/* CUIÚDO • Sistema visual minimalista / Arial / Branco */
:root{
 --bg:#fff;--surface:#fff;--muted-surface:#fafafa;--surface-2:#f5f5f5;
 --ink:#171717;--subink:#666;--dim:#858585;--line:#e9e9e9;--hover:#ccc;
 --accent:#171717;--on-accent:#fff;--warm:#886d51;
 --font:Arial,Helvetica,sans-serif;--radius:11px;
 font-family:var(--font);font-synthesis:none;color-scheme:light
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
 --bg:#121212;--surface:#191919;--muted-surface:#181818;--surface-2:#242424;
 --ink:#f3f3f3;--subink:#b4b4b4;--dim:#999;--line:#303030;--hover:#515151;
 --accent:#eee;--on-accent:#171717;--warm:#ceac8a;color-scheme:dark
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-width:320px;background:var(--bg);color:var(--ink);font:400 clamp(14px,1.15vw,16px)/1.65 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:#dddddd;color:#111}
.icon{width:17px;height:17px;flex-shrink:0}
.skip-link{position:absolute;left:-9999px;padding:12px 16px;background:var(--accent);color:var(--on-accent);z-index:100}
.skip-link:focus{left:16px;top:16px}
.app-shell{min-height:100vh}
.site-header{height:76px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:clamp(18px,2.5vw,38px);height:100%;max-width:1270px;padding:0 clamp(18px,3vw,40px);margin:auto}
.logo{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:var(--ink);flex-shrink:0}
.logo-mark{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink);font:700 21px/1 var(--font)}
.logo-type{font:800 25px/1 var(--font);letter-spacing:-.065em}
.logo-dot{color:var(--warm)}
.desktop-nav{display:flex;gap:3px;justify-content:center;align-items:center;flex:1;min-width:0}
.nav-button,.nav-more{border:0;background:transparent;color:var(--subink);display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:7px;font:600 12px/1.4 var(--font);min-height:40px;padding:9px 11px;white-space:nowrap}
.nav-button svg{display:none}
.nav-more svg{width:13px;height:13px;transform:rotate(90deg)}
.nav-button:hover,.nav-more:hover,.nav-more.active,.nav-button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.header-tools{display:flex;align-items:center;gap:9px;flex-shrink:0}
.appearance-control{display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px}
.theme-option{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;border-radius:6px;min-width:34px;min-height:32px;padding:7px 8px;color:var(--subink);font:600 11px var(--font)}
.theme-option .icon{height:14px;width:14px}
.theme-option.selected,.theme-option:hover{background:var(--surface-2);color:var(--ink)}
.mode-switch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--subink);min-height:39px;padding:9px 11px;font:600 11px var(--font);white-space:nowrap}
.mode-switch.on{color:var(--ink)}
.mode-switch svg{height:15px;width:15px}
.main{max-width:1160px;margin:auto;padding:clamp(26px,4vw,55px) clamp(19px,3.4vw,38px) 50px}
.site-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-top:75px;padding:23px 0;border-top:1px solid var(--line)}
.site-footer>span{font-size:11px;font-weight:700;color:var(--subink);white-space:nowrap}
.site-footer p{font-size:11px;color:var(--dim);line-height:1.7;max-width:520px;margin:0}
.kicker,.card-meta,.eyebrow{font:700 10px/1.4 var(--font);letter-spacing:.105em;color:var(--subink);text-transform:uppercase}
.kicker-mark{color:var(--warm);font-size:14px;margin-right:6px}
.home-hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,.75fr);gap:clamp(28px,5vw,64px);border-bottom:1px solid var(--line);padding:clamp(23px,4vw,56px) 0 clamp(40px,5vw,70px)}
.hero-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0}
.hero-main h1{font:700 clamp(43px,5.7vw,75px)/1.04 var(--font);letter-spacing:-.065em;margin:20px 0 22px}
.hero-main h1 span{font-weight:400}
.hero-main>p{font-size:clamp(14px,1.2vw,16px);line-height:1.8;max-width:570px;margin:0;color:var(--subink)}
.hero-main>p strong{color:var(--ink);font-weight:700}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero-note{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin-top:40px}
.hero-note-line{height:1px;width:27px;background:var(--warm)}
.hero-aside{background:var(--muted-surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;min-height:380px}
.aside-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--subink)}
.aside-top svg{width:16px;height:16px}
.aside-cross{display:grid;place-items:center;height:145px;font:400 98px var(--font);color:var(--hover)}
.hero-aside h2{font:700 clamp(20px,2vw,26px)/1.22 var(--font);letter-spacing:-.04em;margin:auto 0 10px}
.hero-aside p{font-size:12px;line-height:1.7;color:var(--subink);margin:0 0 18px}
.hero-aside .text-link{align-self:flex-start}
.btn{border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--on-accent);min-height:45px;padding:11px 17px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 12px/1.4 var(--font);text-decoration:none;transition:transform .15s,opacity .15s}
.btn svg{height:16px;width:16px}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary,.btn-ghost,.btn-outline{background:var(--surface);color:var(--ink);border-color:var(--hover)}
.btn-muted{background:var(--surface-2);color:var(--subink);border-color:var(--line)}
.btn-small{min-height:35px;padding:8px 12px;font-size:11px}
.text-link,.link-button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 12px/1.4 var(--font);padding:4px 0;text-decoration:none;white-space:normal}
.text-link svg,.link-button svg{height:16px;width:16px}
.text-link:hover,.link-button:hover{text-decoration:underline;text-underline-offset:4px}
.overview-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:47px 0 23px}
.overview-heading h2{font:700 clamp(22px,2.8vw,32px)/1.25 var(--font);letter-spacing:-.035em;margin:8px 0 0}
.overview-date{font-size:11px;color:var(--dim);text-transform:capitalize}
.home-dashboard,.home-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.home-bottom{margin-top:16px}
.card{min-width:0;padding:clamp(20px,2.3vw,29px);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:none}
.card:hover{border-color:var(--hover)}
.feature-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.feature-icon{display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;height:35px;width:35px;color:var(--subink)}
.card-title{font:700 clamp(21px,2.3vw,27px)/1.23 var(--font);letter-spacing:-.04em;margin:20px 0 10px}
.card p{color:var(--subink);font-size:13px;line-height:1.75}
.rosary-feature,.truth-card,.scripture-card,.progress-card{display:flex;flex-direction:column;min-height:260px}
.rosary-feature>p{margin:0}
.feature-progress{margin:auto 0 15px;padding-top:22px}
.progress{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:0 0 10px}
.progress-fill{height:100%;background:var(--ink);border-radius:99px}
.progress-label{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--subink)}
.progress-label strong{color:var(--ink)}
.truth-topic{font-size:12px!important;font-weight:700!important;color:var(--ink)!important;margin:0!important}
.truth-card blockquote{font:400 clamp(13px,1.3vw,15px)/1.7 var(--font);margin:11px 0 18px;color:var(--subink);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.truth-card .text-link,.progress-card .text-link{margin-top:auto}
.scripture-ref{font-size:11px;font-weight:700;color:var(--subink)}
.scripture-card blockquote{font:400 clamp(17px,1.7vw,21px)/1.5 var(--font);letter-spacing:-.02em;margin:20px 0;flex:1}
.scripture-card-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0}
.stat-row>div{display:flex;flex-direction:column;gap:5px}
.stat-row strong{font:700 clamp(27px,3vw,37px)/1 var(--font);letter-spacing:-.05em}
.stat-row strong small{font:600 12px var(--font);color:var(--subink)}
.stat-row span{font-size:11px;line-height:1.45;color:var(--dim)}
.prayer-cta{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-top:36px;padding:29px 0;border-top:1px solid var(--line)}
.prayer-cta h2{font:700 clamp(21px,2.3vw,29px)/1.3 var(--font);letter-spacing:-.03em;margin:7px 0}
.prayer-cta p{font-size:12px;color:var(--subink);margin:0}
.prayer-cta .btn{flex-shrink:0}
.page-title{font:700 clamp(30px,4vw,47px)/1.15 var(--font);letter-spacing:-.052em;margin:3px 0 14px}
.page-desc{font-size:14px;line-height:1.8;color:var(--subink);max-width:730px;margin:0 0 26px}
.eyebrow{display:flex;align-items:center;gap:9px}
.eyebrow:before{content:'';height:1px;width:18px;background:var(--dim)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:33px 0 17px}
.section-head h2{font:700 clamp(20px,2.4vw,28px)/1.3 var(--font);letter-spacing:-.035em;margin:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.stat{display:flex;justify-content:center;flex-direction:column;gap:5px;min-height:98px}
.stat-value{font:700 31px/1 var(--font)}
.stat-label{font-size:11px;color:var(--subink)}
.group-picker,.devotion-filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
.group-button{font:700 12px/1.3 var(--font);border:1px solid var(--line);background:var(--surface);color:var(--subink);border-radius:8px;padding:10px 14px;min-height:39px}
.group-button.active,.group-button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.group-button:hover:not(.active){border-color:var(--hover);color:var(--ink)}
.mystery-layout{display:grid;grid-template-columns:minmax(240px,.7fr) minmax(0,1.3fr);gap:19px;align-items:start}
.mystery-visual{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--muted-surface);min-height:380px;padding:24px}
.mystery-visual img{display:block;width:min(145px,65%);height:169px;object-fit:contain;align-self:center;border-radius:8px;border:1px solid var(--line);margin:15px 0}
.mystery-visual h2{font:700 clamp(22px,2.2vw,28px)/1.23 var(--font);letter-spacing:-.04em;margin:auto 0 10px}
.mystery-visual small{font-size:12px;color:var(--subink)}
.mystery-detail{min-width:0}
.mystery-detail>.card{padding:clamp(20px,2.2vw,29px)}
.readable{font-size:14px;line-height:1.85;color:var(--subink);margin:11px 0}
.scripture-verse{border:1px solid var(--line);border-radius:9px;background:var(--muted-surface);padding:20px;margin-bottom:23px}
.scripture-top,.scripture-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.scripture-verse blockquote{font:400 clamp(18px,1.85vw,23px)/1.6 var(--font);letter-spacing:-.017em;margin:18px 0}
.scripture-footer{font-size:11px;color:var(--dim)}
.scripture-footer a{color:var(--ink);text-underline-offset:3px}
.verse-switch{display:flex;gap:3px;border:1px solid var(--line);background:var(--surface);padding:3px;border-radius:7px}
.verse-switch button{border:0;border-radius:5px;background:transparent;color:var(--subink);padding:6px 9px;min-height:27px;font:700 11px var(--font)}
.verse-switch button.active{background:var(--accent);color:var(--on-accent)}
.kicker-line{height:1px;background:var(--line);margin:25px 0}
.confront{font:700 clamp(19px,2.1vw,25px)/1.4 var(--font);letter-spacing:-.02em;margin:14px 0 19px}
.question{padding:15px;border-left:2px solid var(--ink);background:var(--muted-surface);font-size:13px;line-height:1.8;color:var(--subink)}
.question strong{color:var(--ink)}
.prayer-response{background:var(--muted-surface);border:1px solid var(--line);border-radius:8px;padding:17px;margin-top:16px}
.prayer-response span{font-size:10px;letter-spacing:.1em;color:var(--subink);font-weight:700}
.prayer-response p{color:var(--ink);font-size:13px;line-height:1.8;margin:8px 0 0}
.decade-panel{border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,2.4vw,28px);margin:22px 0 30px;background:var(--surface)}
.decade-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.decade-header strong{font:700 clamp(18px,2vw,22px) var(--font)}
.decade-description{font-size:12px;line-height:1.8;color:var(--subink);margin:14px 0}
.count-bubbles{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:20px 0}
.bead{display:block;width:22px;height:22px;border:1px solid var(--hover);background:var(--surface);border-radius:50%}
.bead.done{background:var(--accent);border-color:var(--accent)}
.decade-buttons,.two-buttons{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:17px}
.stepper{display:flex;flex-wrap:wrap;gap:9px;margin:21px 0}
.step{width:39px;height:39px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--subink);font-size:12px;font-weight:700}
.step.current{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.step.finished:not(.current){color:var(--ink);background:var(--surface-2)}
.prayer-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 28px}
.prayer-card{padding:19px 22px;align-self:start}
.prayer-card summary{cursor:pointer;color:var(--ink);font-size:13px;font-weight:700}
.prayer-card p{color:var(--subink);font-size:13px;line-height:1.8;white-space:pre-line;margin:15px 0 0}
.devotional-source{font-size:11px!important}
.truth-large{max-width:990px;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(23px,4vw,50px);position:relative}
.truth-large h2{font:700 clamp(30px,4.2vw,50px)/1.14 var(--font);letter-spacing:-.043em;margin:18px 0}
.quote-mark{display:none}
.truth-large blockquote{font:700 clamp(19px,2.5vw,29px)/1.45 var(--font);letter-spacing:-.021em;margin:0 0 20px}
.truth-large .readable{max-width:750px}
.action-line{display:flex;align-items:flex-start;gap:12px;padding:15px;background:var(--muted-surface);border:1px solid var(--line);border-radius:9px;color:var(--subink);font-size:13px;line-height:1.75;margin:18px 0}
.action-line svg{color:var(--ink);width:18px;height:18px;flex-shrink:0}
.truth-footer{display:flex;flex-wrap:wrap;gap:8px;margin:19px 0}
.filter-tag{font-size:11px;color:var(--subink);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
.mission-commit{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px;border-top:1px solid var(--line)}
.mission-commit p{font-size:12px;color:var(--subink);line-height:1.7;margin:8px 0 0}
.checklist{display:flex;flex-direction:column;gap:10px}
.checkrow{display:flex;align-items:flex-start;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:18px;cursor:pointer}
.checkrow:hover{border-color:var(--hover)}
.checkrow input{appearance:none;flex:0 0 20px;width:20px;height:20px;background:var(--surface);border:1px solid var(--hover);border-radius:5px;margin:2px 0 0;display:grid;place-items:center}
.checkrow input:checked{background:var(--accent);border-color:var(--accent)}
.checkrow input:checked:after{content:"✓";font:700 13px Arial;color:var(--on-accent)}
.checkrow span{font-size:13px;line-height:1.7;color:var(--ink)}
.checkrow small{display:block;color:var(--subink);font-size:11px;margin-top:4px}
.completion-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:16px 0;font-size:11px;color:var(--subink)}
textarea{width:100%;min-height:140px;border:1px solid var(--hover);border-radius:8px;background:var(--surface);color:var(--ink);padding:14px;resize:vertical;font-size:13px;line-height:1.8}
textarea::placeholder{color:var(--dim)}
.input-label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px}
.note{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:20px;margin:13px 0}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--subink);line-height:1.8;margin:9px 0 0}
.note-date{font-size:11px;color:var(--subink)}
.empty{padding:35px;text-align:center;color:var(--subink);font-size:13px;border:1px dashed var(--line);border-radius:9px}
.devotional-hero{position:relative;padding:0 0 30px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.devotional-hero .eyebrow{margin-bottom:15px}
.angel-mark{position:absolute;right:12px;top:14px;display:grid;place-items:center;width:58px;height:58px;border:1px solid var(--line);border-radius:50%;color:var(--dim)}
.angel-mark svg{width:27px;height:27px}
.devotion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.devotion-card{padding:0;align-self:start}
.devotion-card summary{display:flex;align-items:center;gap:13px;list-style:none;padding:20px;cursor:pointer}
.devotion-card summary::-webkit-details-marker{display:none}
.devotion-card summary:after{content:"+";margin-left:auto;font-size:19px;color:var(--subink)}
.devotion-card[open] summary:after{content:"−"}
.devotion-card summary strong{font-size:15px;color:var(--ink);font-weight:700;display:block}
.devotion-card summary small{display:block;color:var(--dim);margin-top:5px;font-size:11px}
.devotion-symbol{height:37px;width:37px;flex-shrink:0;background:var(--surface-2);color:var(--subink);border-radius:8px;display:grid;place-items:center}
.devotion-symbol svg{width:21px;height:21px}
.devotion-text{padding:19px 22px;border-top:1px solid var(--line);color:var(--subink);font-size:13px;line-height:1.85;white-space:pre-line}
.devotion-link{display:inline-block;margin:0 21px 19px;color:var(--ink);font-size:11px}

 if(a==='mystery')state.mystery=Number(target.dataset.index);
 if(a==='next-mystery')state.mystery=Math.min(4,state.mystery+1);
 if(a==='prev-mystery')state.mystery=Math.max(0,state.mystery-1);
 if(a==='add-bead')changeCount(readProgress()[state.mystery]+1);
 if(a==='undo-bead')changeCount(readProgress()[state.mystery]-1);
 if(a==='reset-decade'&&confirm('Reiniciar a contagem desta dezena?'))changeCount(0);
 if(a==='next-truth')state.truthOffset=(state.truthOffset+1)%truthDeck().length;
 if(a==='toggle-mode'){state.mode=state.mode==='brutal'?'firme':'brutal';state.truthOffset=0;save();}
 if(a==='toggle-theme'){state.theme=state.theme==='light'?'dark':'light';save();}
 if(a==='set-theme'){state.theme=['light','dark','system'].includes(target.dataset.theme)?target.dataset.theme:'light';save();}
 if(a==='toggle-more'){state.mobileMore=!state.mobileMore;}
 if(a==='close-more'){state.mobileMore=false;}
 if(a==='verse-lang'){state.verseLang=target.dataset.lang==='en'?'en':'pt';save();}
 if(a==='mission-done'){state.missionDays??={};state.missionDays[missionId()]=!missionDone();save();}
 if(a==='delete-note'){
   const i=Number(target.dataset.index);
   if(confirm('Excluir esta reflexão do diário?')){state.notes.splice(i,1);save();}else return;
 }
 render();
});
app.addEventListener('change',evt=>{
 const t=evt.target;if(t.dataset.kind==='challenge'){checkChallenge(Number(t.dataset.index),t.checked);render();}
 if(t.dataset.kind==='examine'){checkExamine(Number(t.dataset.index),t.checked);render();}
});
app.addEventListener('submit',evt=>{
 if(evt.target.id!=='journal-form')return;
 evt.preventDefault();const text=evt.target.querySelector('textarea')?.value.trim();
 if(!text)return;
 state.notes??=[];state.notes.unshift({time:new Date().toISOString(),text:text.slice(0,2000)});state.notes=state.notes.slice(0,100);
 save();render();
});
render();
if(window.matchMedia){const query=window.matchMedia('(prefers-color-scheme: dark)');if(query.addEventListener)query.addEventListener('change',()=>{if(state.theme==='system')render();});}
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

function combatNormalize(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');}
function combatSaved(id){return Boolean(state.feedSaved?.[id]);}

function combatMatches(p){
 if(state.feedFilter==='salvos'&&!combatSaved(p.id))return false;
 if(state.feedFilter!=='salvos'&&state.feedFilter!=='todos'&&p.category!==state.feedFilter)return false;
 const q=combatNormalize(state.feedTerm).trim();
 return !q||combatNormalize([p.title,p.kicker,p.ref,p.reflection,p.action].join(' ')).includes(q);

home=combatHome;
render=function(){
 setTheme();
 const pages={inicio:combatHome,terco:rosary,devocionario:devocionario,palavra:combatBible,diario:diary,verdade:truth,desafios:challenges,exame:examine};
 app.innerHTML=renderShell((pages[state.tab]||combatHome)());
 document.title=(combatTabs.find(t=>t.id===state.tab)?.label||'Feed')+' | CUIÚDO';
 if(document.body?.classList)document.body.classList.toggle('combat-modal-open',Boolean(state.feedOpen));
};
state.feedSaved=state.feedSaved&&typeof state.feedSaved==='object'?state.feedSaved:{};

if(!['dark','light','system'].includes(state.theme))state.theme='dark';
app.addEventListener('click',event=>{
 const target=event.target.closest?.('[data-action]');if(!target)return;
 const action=target.dataset.action;
 if(action==='combat-close'&&target!==event.target&&event.target.closest('.feed-modal'))return;
 if(action==='combat-filter'){state.feedFilter=target.dataset.filter;save();}
 else if(action==='combat-open'){state.feedOpen=target.dataset.id;state.feedToast='';}
 else if(action==='combat-close'){state.feedOpen=null;state.feedToast='';}
 else if(action==='combat-save'){const id=target.dataset.id;state.feedSaved[id]=!combatSaved(id);save();}
 else if(action==='combat-done'){const id=target.dataset.id;state.feedDone[currentDay()]??={};state.feedDone[currentDay()][id]=!combatDone(id);save();}
 else if(action==='combat-share'){
   const p=feedPosts.find(p=>p.id===target.dataset.id);
   if(p){
    const url=(location.origin||'https://devbrunoo.github.io')+(location.pathname||'/Terc0-homens/')+'#post='+encodeURIComponent(p.id);
    const content={title:p.title,text:'CUIÚDO — '+p.title,url};
    if(navigator.share)navigator.share(content).catch(()=>{});
    else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(p.title+'\n'+url).then(()=>{state.feedToast='Link copiado para compartilhar';render();},()=>{state.feedToast='Não foi possível copiar. Link: '+url;render();});
    else state.feedToast='Compartilhe: '+url;
   }
 }else return;
 render();
});
app.addEventListener('input',event=>{
 if(event.target.id!=='feed-search')return;
 state.feedTerm=event.target.value;
 let count=0;
 for(const element of app.querySelectorAll('[data-feed-id]')){
  const p=feedPosts.find(x=>x.id===element.dataset.feedId);
  const visible=Boolean(p&&combatMatches(p));element.hidden=!visible;if(visible)count++;
 }
 const counter=app.querySelector('#feed-result-count');if(counter)counter.textContent=String(count);
});
if(document.addEventListener)document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&state.feedOpen){state.feedOpen=null;render();}
});
render();
if(window.location?.hash?.startsWith('#post=')){
 const id=decodeURIComponent(window.location.hash.slice(6));
 if(feedPosts.some(p=>p.id===id)){state.tab='inicio';state.feedOpen=id;render();}
}
