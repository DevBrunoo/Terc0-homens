<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" aria-labelledby="title desc">
<title id="title">Quem quer insiste e dá um jeito</title>
<desc id="desc">Campo rural ao pôr do sol, trator e estrada sinuosa, com passos de perseverança e a mensagem: Quem quer tenta, erra, insiste, melhora, tenta de novo e dá um jeito; quem não quer dá uma desculpa.</desc>
