<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
<title id="title">Fidelidade a Deus acima da tentação</title>
<desc id="desc">Pôster de faroeste em tons de sépia com um vaqueiro e a mensagem: O cuiúdo não troca Deus por prazer passageiro. O macio troca seus princípios por qualquer tentação.</desc>
